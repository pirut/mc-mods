// A mod's Fabric jar: mods/<mod>/fabric/build.gradle applies this and adds its own dependencies.

plugins {
    id 'mcmods.mod'
    id 'fabric-loom'
}

loom {
    runs {
        server { runDir 'run-server' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${modMetadata.loader_version ?: loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

if (usesCommonLib) {
    dependencies { include project(':common-lib') }
}
