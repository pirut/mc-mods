// What every loader project of a mod shares. Applied by mcmods.neoforge and mcmods.fabric; a mod never applies it
// itself. The project is mods/<mod>/<loader>, and its parent (mods/<mod>) holds gradle.properties with mod_id,
// mod_name, mod_version, mod_group, mod_description and anything else the mod's metadata files use.
//
// A build is for one Minecraft version (settings.gradle picks it and merges its properties into every project).
// Everything it makes goes in build/<minecraft>/, so builds for different versions never mix.

plugins {
    id 'java'
}

def modDir = project.parent.projectDir
def loader = project.name

version = mod_version
group = mod_group
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraft_version}")

def javaVersion = (findProperty('java_version') ?: '21').toString() as int
java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

base.archivesName = "${mod_id}-${loader}-${minecraft_version}"

repositories {
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        url = 'https://maven.parchmentmc.org'
        content { includeGroup 'org.parchmentmc.data' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// Code and assets shared by the loaders live in mods/<mod>/common and go into every loader's jar.
def common = new File(modDir, 'common/src/main')
if (common.exists()) {
    sourceSets.main {
        java.srcDir new File(common, 'java')
        resources.srcDir new File(common, 'resources')
    }
}

// Code that differs between Minecraft versions: extra_src lists more source folders for this version, relative to
// the mod folder, usually set in mods/<mod>/versions/<mc>.properties. A folder under common/ goes into every
// loader's jar; one under neoforge/ or fabric/ only into that loader's. A folder named java or resources is added
// as it is; any other folder adds its java/ and resources/ (so common/src/mc1.21.11 adds
// common/src/mc1.21.11/java and common/src/mc1.21.11/resources). exclude_src lists Ant patterns (such as
// **/FooMixin.java) to leave out of the sources and resources for this version.
def csv = { key -> (findProperty(key) ?: '').toString().split(',').collect { it.trim() }.findAll() }
csv('extra_src').each { path ->
    def dir = new File(modDir, path)
    def first = path.replace('\\', '/').split('/')[0]
    if (first in ['neoforge', 'fabric'] && first != loader) return
    if (!dir.isDirectory()) throw new GradleException("extra_src: ${dir} is not a folder")
    sourceSets.main {
        if (dir.name == 'java') java.srcDir dir
        else if (dir.name == 'resources') resources.srcDir dir
        else {
            java.srcDir new File(dir, 'java')
            resources.srcDir new File(dir, 'resources')
        }
    }
}
csv('exclude_src').each { pattern ->
    sourceSets.main {
        java.exclude pattern
        resources.exclude pattern
    }
}
def commonTest = new File(modDir, 'common/src/test/java')
if (commonTest.exists()) sourceSets.test.java.srcDir commonTest

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

// License texts go into the jar's META-INF. A mod with its own COPYING / COPYING.LESSER / LICENSE files uses
// those; otherwise the repo's LGPL texts.
def licenseFiles = ['COPYING', 'COPYING.LESSER', 'LICENSE'].collect { new File(modDir, it) }.findAll { it.exists() }
if (licenseFiles.isEmpty()) licenseFiles = ['COPYING', 'COPYING.LESSER'].collect { rootProject.file(it) }
tasks.named('jar', Jar) {
    licenseFiles.each { f -> from(f) { into 'META-INF'; rename { "${mod_id}-${f.name}.txt" } } }
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': findProperty('mod_authors') ?: '')
}

// ${...} in neoforge.mods.toml and fabric.mod.json is filled from the properties settings.gradle merged for this
// Minecraft version: the repo's, versions/<mc>.properties, the mod's gradle.properties, the mod's versions/<mc>.properties.
def metadata = new TreeMap(mcmodsProperties)
metadata.mod_version = mod_version
tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) { expand metadata }
}

// Bundles the internal library (common-lib) into the jar when the mod asks for it with uses_common_lib=true.
// Each loader plugin nests it its own way (jarJar / include); the newest copy wins when several mods have it.
ext.usesCommonLib = findProperty('uses_common_lib')?.toString() == 'true'
if (usesCommonLib) {
    dependencies { implementation project(':common-lib') }
}
