// A mod's NeoForge jar: mods/<mod>/neoforge/build.gradle applies this and adds its own dependencies.

plugins {
    id 'mcmods.mod'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

if (usesCommonLib) {
    dependencies {
        jarJar(project(':common-lib'))
        additionalRuntimeClasspath project(':common-lib')
    }
}

// Pirut Lib (mods/pirutlib), when the mod asks for it with uses_pirut_lib=true: compiled against, nested in the
// jar, and loaded as a mod in dev runs.
if (findProperty('uses_pirut_lib')?.toString() == 'true' && project.path != ':pirutlib:neoforge') {
    evaluationDependsOn(':pirutlib:neoforge')
    def lib = project(':pirutlib:neoforge')
    dependencies {
        implementation lib
        jarJar(lib)
    }
    neoForge.mods {
        pirutlib { sourceSet lib.sourceSets.main }
    }
}
