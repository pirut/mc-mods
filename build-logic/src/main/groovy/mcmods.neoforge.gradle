// A mod's NeoForge jar: mods/<mod>/neoforge/build.gradle applies this and adds its own dependencies.

plugins {
    id 'mcmods.mod'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version
    // Minecraft 26.1 and later ship without obfuscation and need no Parchment names.
    if (findProperty('parchment_mappings_version')) {
        parchment {
            mappingsVersion = parchment_mappings_version
            minecraftVersion = parchment_minecraft_version
        }
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

// Before Minecraft 1.21.9, NeoForge's dev runs only saw plain (non-mod) libraries put in additionalRuntimeClasspath;
// later versions see every dependency and refuse that configuration. Mods check neoLegacyClasspath too.
ext.neoLegacyClasspath = neoForge.versionCapabilities.legacyClasspath()

if (usesCommonLib) {
    dependencies {
        jarJar(project(':common-lib'))
        if (neoLegacyClasspath) additionalRuntimeClasspath project(':common-lib')
    }
}
