// A mod's NeoForge jar: mods/<mod>/neoforge/build.gradle applies this and adds its own dependencies.

plugins {
    id 'mcmods.mod'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version
    // Minecraft 26.1 and later ship without obfuscation and need no Parchment names.
    if (findProperty('parchment_mappings_version')) {
        parchment {
            mappingsVersion = parchment_mappings_version
            minecraftVersion = parchment_minecraft_version
        }
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

if (usesCommonLib) {
    dependencies {
        jarJar(project(':common-lib'))
        additionalRuntimeClasspath project(':common-lib')
    }
}
