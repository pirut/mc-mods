name: Verify CC Agent Beta
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Modrinth project state and released file hashes
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download cc-agent-v0.5.3-beta.1 -R pirut/mc-mods -p '*.jar'
          python3 - <<'PY'
          import requests, os, hashlib, pathlib
          s = requests.Session()
          s.headers['Authorization'] = os.environ['MODRINTH_TOKEN']
          def read(path):
              r = s.get('https://api.modrinth.com/v2/' + path)
              r.raise_for_status()
              return r.json()
          p = read('project/7PftksQN')
          print(p['title'], p['id'], p['status'])
          for vid in ['dLz0eoet','Pi1wDVgI']:
              v = read('version/' + vid)
              f = v['files'][0]
              assert v['project_id'] == p['id'] and v['version_type'] == 'beta'
              assert hashlib.sha512(pathlib.Path(f['filename']).read_bytes()).hexdigest() == f['hashes']['sha512']
              print(vid, v['status'], v['version_type'], f['filename'], 'SHA-512 matched')
          PY
