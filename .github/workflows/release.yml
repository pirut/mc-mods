name: Release

# Each mod releases on its own, as the tag <folder>-v<mod_version> (for example cc-agent-v0.5.1), with its jars
# and the notes from its CHANGELOG.md section. Only the mods being released are built.
#
# - Push to main: every mod whose current mod_version has no release yet. So bumping mod_version and adding a
#   '## <version>' section to the mod's CHANGELOG.md releases it on merge.
# - Push a tag <folder>-v<version> by hand: that mod (the version must match its gradle.properties).
# - Run this workflow from the Actions tab with a mod folder: that mod's current version. This also uploads a
#   version that is already on GitHub to the stores (a first upload, or a retry of a failed one).
#
# Mods with a modrinth_project_id in their gradle.properties are also uploaded to Modrinth. That needs the
# MODRINTH_TOKEN secret (a Modrinth personal access token with "Create versions"). Mods with a
# curseforge_project_id (the number under About Project on the CurseForge page) are also uploaded to CurseForge.
# That needs the CURSEFORGE_TOKEN secret (CurseForge > Account settings > API tokens). Modrinth skips versions it
# already has; CurseForge can't tell, so a run by hand uploads there only with "Upload to CurseForge too" ticked.

on:
  push:
    branches: [main]
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      mod:
        description: Mod folder in mods/ (for example cc-agent)
        required: true
      curseforge:
        description: Upload to CurseForge too. Leave it unticked if CurseForge already has this version, or it gets the files twice.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile current store files
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          INPUT_MOD: ${{ inputs.mod }}
        run: |
          if [ "$INPUT_MOD" = inventory ]; then
            python3 .github/scripts/store-inventory.py
          elif [ "$INPUT_MOD" = chunks3 ]; then
            dir="$RUNNER_TEMP/current"
            gh release download chunks3-v0.1.0-alpha.1 -D "$dir"
            (cd "$dir" && sha256sum -c SHA256SUMS.txt)
            for loader in neoforge fabric; do
              mkdir -p "mods/chunks3/$loader/build/libs"
              cp "$dir"/chunks3-"$loader"-*.jar "mods/chunks3/$loader/build/libs/"
            done
            CURSEFORGE_UPLOAD=1 bash .github/scripts/release-mod.sh chunks3
          fi
