name: Cubic Flight Beta submission
on:
  workflow_dispatch:
    inputs:
      mod:
        required: true
        type: string
jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 .release/cubic-flight/submit.py
        env:
          STORE: ${{ inputs.mod }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
