name: Blood Feud Modrinth page (one-off, removed after it runs)

# Run 4: puts brand/STORE.md on Modrinth again and swaps the featured gallery image for the clean crop.

on:
  push:
    branches: [claude/project-thread-h43lcs]
    paths: [.github/workflows/bloodfeud-modrinth-page.yml]

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      AGENT: pirut/mc-mods release workflow
      PROJECT: rMYOTuVl
    steps:
      - uses: actions/checkout@v4
      - name: Description and featured image
        run: |
          set -euo pipefail
          api=https://api.modrinth.com/v2
          b=mods/bloodfeud/brand
          tail -n +3 $b/STORE.md | jq -Rs '{body: .}' > body.json
          curl -sS --fail-with-body -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" -H 'Content-Type: application/json' \
            -X PATCH --data @body.json "$api/project/$PROJECT"
          echo "Description updated"
          curl -sS -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" "$api/project/$PROJECT" > project.json
          jq -c '.gallery[] | {title, featured, ordering, url}' project.json
          old=$(jq -r '.gallery[] | select(.title == "A pack comes to meet you") | .url' project.json | head -n1)
          if [ -n "$old" ]; then
            u=$(jq -rn --arg u "$old" '$u|@uri')
            curl -sS --fail-with-body -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" -X DELETE "$api/project/$PROJECT/gallery?url=$u"
            echo "Removed the old featured image"
          fi
          q=$(jq -rn --arg t "A pack comes to meet you" \
            --arg d "Every Brute has a name, a level and a boss bar. Bosses wear the pack's banner and stand taller." \
            '"ext=jpg&featured=true&title=\($t|@uri)&description=\($d|@uri)&ordering=1"')
          curl -sS --fail-with-body -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" -H 'Content-Type: image/jpeg' \
            --data-binary "@$b/store/pack-comes-clean.jpg" -X POST "$api/project/$PROJECT/gallery?$q"
          echo "Added the clean featured image"
