name: Blood Feud Modrinth page (one-off, removed after it runs)

# Run 2: query string built by hand (curl -G sent the image as the query).
# Puts the store page text (brand/STORE.md) and the screenshots in brand/store/ on the Modrinth project.

on:
  push:
    branches: [claude/project-thread-h43lcs]
    paths: [.github/workflows/bloodfeud-modrinth-page.yml]

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      AGENT: pirut/mc-mods release workflow
      PROJECT: rMYOTuVl
    steps:
      - uses: actions/checkout@v4
      - name: Description and gallery
        run: |
          set -euo pipefail
          api=https://api.modrinth.com/v2
          b=mods/bloodfeud/brand
          tail -n +3 $b/STORE.md | jq -Rs '{body: .}' > body.json
          curl -sS --fail-with-body -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" -H 'Content-Type: application/json' \
            -X PATCH --data @body.json "$api/project/$PROJECT" || { echo "::error::Description update failed"; exit 1; }
          echo "Description updated"
          have=$(curl -sS -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" "$api/project/$PROJECT" | jq '.gallery | length')
          if [ "$have" != 0 ]; then echo "Gallery already has $have images; leaving it."; exit 0; fi
          n=0
          while IFS='|' read -r file featured title desc; do
            n=$((n+1))
            q=$(jq -rn --arg f "$featured" --arg t "$title" --arg d "$desc" --arg o "$n" \
              '"ext=jpg&featured=\($f)&title=\($t|@uri)&description=\($d|@uri)&ordering=\($o)"')
            curl -sS --fail-with-body -A "$AGENT" -H "Authorization: $MODRINTH_TOKEN" -H 'Content-Type: image/jpeg' \
              --data-binary "@$b/store/$file" -X POST "$api/project/$PROJECT/gallery?$q" || { echo; echo "::error::Gallery upload of $file failed"; exit 1; }
            echo "Gallery $n: $file"
          done <<'LIST'
          pack-comes.jpg|true|A pack comes to meet you|Every Brute has a name, a level and a boss bar. Bosses wear the pack's banner and stand taller.
          wears-your-gear.jpg|false|It took your gear|The Brute that killed you wears your armor and swings your sword. Kill it to get them back.
          scars.jpg|false|They come back scarred|A Brute that came back from death wears how it died: stitches, arrow holes, claw marks.
          scars-families.jpg|false|Every family scars|Witches, spiders, wither skeletons and illagers carry their scars too.
          ledger-pack.jpg|false|Every pack has a story|Its banner, Boss, Brutes, rivals and your grudge.
          ledger-brute.jpg|false|Know your enemy|A Brute's page: portrait, traits you've found out, scars and what it remembers about you.
          ledger-map.jpg|false|Map of the feuds|Every pack home you know, drawn on the land around you.
          LIST
