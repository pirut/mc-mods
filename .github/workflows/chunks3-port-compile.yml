# TEMPORARY: compiles Chunks3 against another Minecraft version and saves the errors, for the port. Removed before merge.
name: Chunks3 port compile
on:
  push:
    branches: [claude/project-thread-27i95n]
    paths: [.github/workflows/chunks3-port-compile.yml, .github/chunks3-port/**, mods/chunks3/**]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: 1.21.11, neo: 21.11.48, pmc: 1.21.11, parch: 2025.12.20, fapi: 0.141.6+1.21.11 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set +e
          P="-Pminecraft_version=${{ matrix.mc }} -Pneo_version=${{ matrix.neo }} -Pparchment_minecraft_version=${{ matrix.pmc }} -Pparchment_mappings_version=${{ matrix.parch }} -Pfabric_api_version=${{ matrix.fapi }}"
          rm -rf mods/bug-courier mods/cc-agent template
          sed -i "s/^addMod(file(.template.))//" settings.gradle
          mkdir -p out
          ./gradlew --console=plain --continue -I .github/chunks3-port/maxerrs.gradle $P :chunks3:neoforge:compileJava :chunks3:neoforge:compileTestJava > out/neoforge-${{ matrix.mc }}.log 2>&1
          ./gradlew --console=plain --continue -I .github/chunks3-port/maxerrs.gradle $P :chunks3:fabric:compileJava > out/fabric-${{ matrix.mc }}.log 2>&1
          true
      - run: |
          cd out
          git init -q -b c
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Chunks3 compile ${{ matrix.mc }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" c:claude/chunks3-compile-${{ matrix.mc }}
