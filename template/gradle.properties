# Rename all of these for a new mod (see template/README.md).
mod_id=examplemod
mod_name=Example Mod
mod_version=0.1.0
mod_group=io.github.pirut.examplemod
mod_description=A starting point for a new mod.

# The Minecraft versions to build for (each needs a versions/<mc>.properties in the repo root). The template
# builds for all of them, so CI checks every version's setup. Without this line, only mc_default.
minecraft_targets=1.21.1,1.21.4,1.21.8,1.21.11,26.1.2,26.2,26.3

# The Modrinth project's id (project page > ... > Copy ID). Leave empty for GitHub releases only.
modrinth_project_id=

# Bundle the repo's internal library (common-lib) into the jars.
uses_common_lib=true
