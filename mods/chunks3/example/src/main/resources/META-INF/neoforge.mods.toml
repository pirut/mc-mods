modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="chunks3example"
version="${mod_version}"
displayName="Chunks3 Example"
description='''One cubic dimension, the Highlands, to show how a mod uses Chunks3. Type /cubes enter in game.'''

[[dependencies.chunks3example]]
    modId="chunks3"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.chunks3example]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.chunks3example]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
