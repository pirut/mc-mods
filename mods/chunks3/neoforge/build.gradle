plugins {
    id 'mcmods.neoforge'
}

// Sources hold the code for every Minecraft version Chunks3 builds for (see ../preprocess.gradle).
apply from: '../preprocess.gradle'

dependencies {
    // The far renderer reads shader packs through Iris when it is installed; never bundled.
    compileOnly("maven.modrinth:iris:${iris_neoforge_version}") { transitive = false }
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// The engine's tests (in common/src/test) need Minecraft and the engine's mixins applied, so they run here as
// NeoForge unit tests, in a game set up without a window. The Fabric project skips them.
neoForge {
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}
