modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/pirut/mc-mods/issues"

# Lithium speeds these up by reading LevelChunk sections directly. In a cubic dimension those carrier
# chunks are 16 blocks tall and empty (blocks live in cubes), so players and mobs fell through the
# ground, and rays, explosions, redstone, hoppers and block patterns would miss blocks. Lithium reads
# this from every installed mod and turns these features off; everything else in Lithium stays on.
"lithium:options" = { "mixin.entity.collisions.movement" = false, "mixin.entity.collisions.intersection" = false, "mixin.world.raycast" = false, "mixin.world.explosions.block_raycast" = false, "mixin.world.inline_block_access" = false, "mixin.block.redstone_wire" = false, "mixin.block_pattern_matching" = false, "mixin.ai.non_poi_block_search" = false, "mixin.ai.poi.fast_portals" = false, "mixin.entity.inactive_navigations" = false, "mixin.util.block_entity_retrieval" = false }

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/pirut/mc-mods/tree/main/mods/chunks3"
authors="JR Bussard"
credits='''The cubic engine of Earth Platform. Its distant terrain renderer is built on ideas from Voxy by Cortex (MCRcortex) and Distant Horizons by James Seibel and contributors: the voxel level pyramid, detail by on-screen size, compact GPU faces and Voxy's shader-pack interface from Voxy; exact far heights and server-built far terrain from Distant Horizons. It contains no code from either.'''
description='''
Cubic chunks for other mods to build on. A mod registers a dimension with Chunks3 and its blocks then live in
16-block cubes from Y -16,384 to 16,383, with vanilla mining, building, light, mobs and redstone working on top
and a distant terrain renderer that works with Sodium and Iris shader packs. Adds nothing to the game by itself.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="${iris_neoforge_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="${sodium_neoforge_range}"
ordering="AFTER"
side="CLIENT"
