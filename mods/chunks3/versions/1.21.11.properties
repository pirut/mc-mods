# 1.21.11 compiles mc12111/, the engine port from before the Cubic world type. It does not replace the 1.21.1
# sources, so the Cubic world type stays on 1.21.1 whichever of these changes merges first.
src_root=mc12111

# Iris is compiled against (never bundled). Modrinth version ids of the tested 1.21.11 builds.
iris_neoforge_version=6zJsI0eO
iris_fabric_version=ka9PDlsN

# The Sodium and Iris builds the far renderer works with. The Sodium options page and Mod Menu button are not
# compiled on 1.21.11: those mods' 1.21.11 builds have not been checked, so the version ids are cleared.
iris_neoforge_range=[1.10.0,1.11)
sodium_neoforge_range=[0.8.0,0.9)
iris_fabric_breaks=<1.10.0
sodium_fabric_breaks=<0.8.0
sodium_neoforge_version=
sodium_fabric_version=
modmenu_version=

# The mixins into other mods stay out until each is checked against that mod's 1.21.11 build. The lightmap ring is
# for 1.21.1's lightmap, uploaded from the CPU every tick; 1.21.11 draws its lightmap on the GPU.
# Fabric's level stage, fog and debug screen hooks are for 1.21.1's renderer.
exclude_src=**/mixin/compat/**,**/client/CubicLightmapTexture.java,**/mixin/CubicLightmapTextureMixin.java,**/fabric/mixin/LevelRendererStagesMixin.java,**/fabric/mixin/FogRendererHooksMixin.java,**/fabric/mixin/DebugScreenMixin.java
