# Iris is compiled against (never bundled) for the far renderer's shader pack support. Modrinth version ids of
# the tested builds, fetched through Modrinth's Maven.
iris_neoforge_version=6zJsI0eO
iris_fabric_version=ka9PDlsN

# The Sodium and Iris builds the far renderer works with.
iris_neoforge_range=[1.10.0,1.11)
sodium_neoforge_range=[0.8.0,0.9)
iris_fabric_breaks=<1.10.0
sodium_fabric_breaks=<0.8.0

# The mixins into other mods stay out until each is checked against that mod's 1.21.11 build. The lightmap ring is
# for 1.21.1's lightmap, uploaded from the CPU every tick; 1.21.11 draws its lightmap on the GPU.
# Fabric's level stage, fog and debug screen hooks are for 1.21.1's renderer: from 1.21.5 the cubes and far terrain draw
# from common hooks (CubicSectionGroupMixin, CubicFogMixin), and the debug screen lines are not ported yet.
exclude_src=**/mixin/compat/**,**/client/CubicLightmapTexture.java,**/mixin/CubicLightmapTextureMixin.java,\
  **/fabric/mixin/LevelRendererStagesMixin.java,**/fabric/mixin/FogRendererHooksMixin.java,**/fabric/mixin/DebugScreenMixin.java
