modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/pirut/mc-mods/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/pirut/mc-mods/tree/main/mods/bloodfeud"
authors = "${mod_authors}"
logoFile = "assets/bloodfeud/icon.png"
description = '''${mod_description}'''


[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "pirutlib"
type = "required"
versionRange = "[0.1.0-alpha.2,)"
ordering = "AFTER"
side = "BOTH"
