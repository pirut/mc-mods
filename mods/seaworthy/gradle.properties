mod_id=seaworthy
mod_name=Create: Seaworthy
mod_version=0.1.0-alpha.1
mod_group=io.github.pirut.seaworthy
mod_description=Watertight hulls for Create Aeronautics and Sable ships: no water inside a sealed hull, real displacement buoyancy, and compartments that flood through holes below the waterline.

# Fill in once the Modrinth project exists (its id, from the project page's ... menu > Copy ID).
modrinth_project_id=

uses_common_lib=false

# Sable, the physics mod under Create Aeronautics. Built against this version, needs at least sable_version_min.
# 1.0.4 is the oldest Sable on its maven; it and every release up to 2.0.6 tested fine in-game (2026-11-01).
sable_version=2.0.6
sable_version_min=1.0.4
sable_companion_version=1.6.0
# Sable bundles Veil, which needs Fabric Loader 0.18.4 or newer.
loader_version=0.18.4
