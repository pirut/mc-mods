mod_id=bugcourier
mod_name=Bug Courier
mod_version=0.2.0
mod_group=io.bugcourier
mod_description=A clear in-game way to report bugs to the mods you play.

# The Minecraft versions Bug Courier is built for. Each has a versions/<mc>.properties here with the source
# folders that differ for that version (see versions/README.md).
minecraft_targets=1.21.1,1.21.4,1.21.5,1.21.8,1.21.10,1.21.11,26.1.2,26.2,26.3
loader_version_range=[1,)

# Releases also go to Modrinth once this is filled in (the id from the project page's ... menu > Copy ID).
# Empty means GitHub releases only.
modrinth_project_id=

# Bundles the repo's internal library (state file helpers).
uses_common_lib=true
