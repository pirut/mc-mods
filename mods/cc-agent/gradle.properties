mod_id=ccagent
mod_name=CC: Agent
mod_version=0.5.2
mod_group=io.github.pirut.ccagent
mod_description=Lets Claude Code, Codex or any MCP client write programs for and drive CC: Tweaked computers and turtles, through a local MCP server.

# Releases go to GitHub only: no Modrinth project for this mod.
modrinth_project_id=

# Bundles the repo's internal library (config file helpers).
uses_common_lib=true

# CC: Tweaked. The mod uses a few of its internal classes (the computer registry and terminal), so it
# is built and tested against this version and asks for at least it.
cc_version=1.120.2
cc_version_min=1.120.0
pty4j_version=0.13.13
kotlin_stdlib_version=2.1.21
