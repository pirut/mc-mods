modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/pirut/mc-mods/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/pirut/mc-mods/tree/main/mods/cc-agent"
logoFile = "assets/ccagent/icon.png"
authors = "${mod_authors}"
credits = "Bundles pty4j (EPL-1.0) and the Kotlin standard library (Apache-2.0). Not affiliated with CC: Tweaked, Anthropic or OpenAI."
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "computercraft"
type = "required"
versionRange = "[${cc_version_min},)"
ordering = "AFTER"
side = "BOTH"
