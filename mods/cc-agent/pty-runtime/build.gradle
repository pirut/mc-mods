plugins { id 'java-library' }

group = 'io.github.pirut.ccagent'
version = pty4j_version
repositories { mavenCentral() }

configurations { upstream }
dependencies {
    upstream("org.jetbrains.pty4j:pty4j:${pty4j_version}") { transitive = false }
}

// Keep upstream Java classes and Unix native resources together so pty4j can
// resolve them normally. Windows terminals use pty4j.preferred.native.folder.
tasks.named('jar', Jar) {
    from({ zipTree(configurations.upstream.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'resources/com/pty4j/native/win/**'
    }
    from('NOTICE', 'LICENSE', 'UPSTREAM-NOTICE') { into 'META-INF' }
}
