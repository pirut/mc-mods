plugins {
    id 'fabric-loom' version '1.17.21'
}

base.archivesName = "ccagent-fabric-${minecraft_version}"

loom {
    runs {
        server { runDir 'run-server' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "cc.tweaked:cc-tweaked-${minecraft_version}-fabric:${cc_version}"

    // A real terminal for the agents' TUIs. Minecraft already ships JNA.
    include(implementation("org.jetbrains.pty4j:pty4j:${pty4j_version}") { transitive = false })
    include(implementation("org.jetbrains.kotlin:kotlin-stdlib:${kotlin_stdlib_version}") { transitive = false })
}
