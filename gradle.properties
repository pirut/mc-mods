org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configuration-cache=false

# Shared by every mod. A mod can override any of these in its own mods/<mod>/gradle.properties.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

neo_version=21.1.259
neo_version_range=[21.1.0,21.2)

# Fabric: compile against the oldest loader we accept (newer loaders' Mixin output can crash older MixinExtras).
loader_version=0.16.14
fabric_api_version=0.116.17+1.21.1

mod_license=LGPL-3.0-only
mod_authors=JR Bussard

# The internal library's own version. Bump it whenever common-lib changes, so the newest copy wins when
# several mods bundle it.
common_lib_version=0.1.0
