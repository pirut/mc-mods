org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configuration-cache=false

# Shared by every mod. A mod can override any of these in its own mods/<mod>/gradle.properties.
#
# The Minecraft-specific versions (Minecraft, NeoForge, Fabric Loader and API, Parchment, Java) live in
# versions/<minecraft>.properties, one file per Minecraft version. A build is for one Minecraft version: this
# one, or another with -Pmc=<minecraft> (see the README).
mc_default=1.21.1

mod_license=LGPL-3.0-only
mod_authors=JR Bussard

# The internal library's own version. Bump it whenever common-lib changes, so the newest copy wins when
# several mods bundle it.
common_lib_version=0.1.0
